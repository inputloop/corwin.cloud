# corwin.cloud on gw33: nginx server block. Serves public/ (the output of build.py) as plain files.
# Copyright 2026 INPUTLOOP; GPL-3.0-or-later OR LGPL-3.0-or-later.
#
# Installed by install-tls.sh once certbot holds the certificate (webroot, so nginx never stops).
# Copy deploy/topology-csp.conf (generated by build.py when
# topology is staged) next to this file as /etc/nginx/snippets/corwin-cloud-topology-csp.conf.

server {
    listen 80;
    listen [::]:80;
    server_name corwin.cloud www.corwin.cloud;
    # renewals answer here, over plain http, from the same webroot the certificate was first issued from
    location /.well-known/acme-challenge/ {
        root /var/www/corwin.cloud/public;
    }
    location / {
        return 301 https://corwin.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name corwin.cloud www.corwin.cloud;
    ssl_certificate     /etc/letsencrypt/live/corwin.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corwin.cloud/privkey.pem;

    root /var/www/corwin.cloud/public;
    index index.html;
    error_page 404 /404.html;
    autoindex off;

    # The site's own pages: scripts and styles from this origin only; nothing inline; no other host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Release channels. about-corwin's minter (a timer on this host, as the gw33 user) writes
    # /var/www/corwin.cloud-dist/about-corwin/: channel.json, the tarballs and their manifests. That
    # folder is outside public/, so install.sh's rsync --delete never touches it. ^~ keeps the css/js
    # regex below from catching anything in here. add_header does not inherit, so repeat the safe ones.
    location ^~ /dist/ {
        alias /var/www/corwin.cloud-dist/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # topology, staged from its own checkout at build time. Its pages carry inline scripts, so this
    # subtree has its own policy that lists each by hash (generated by build.py). add_header does
    # not inherit into a location that sets its own, so the other headers are repeated.
    location /topology/ {
        include snippets/corwin-cloud-topology-csp.conf;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
