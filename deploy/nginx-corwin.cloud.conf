# corwin.cloud on gw33: nginx server block. Serves public/ (the output of build.py) as plain files.
# Copyright 2026 INPUTLOOP; GPL-3.0-or-later.
#
# Installed by install-tls.sh once certbot holds the certificate (webroot, so nginx never stops).
# Copy deploy/topology-csp.conf (generated by build.py when
# topology is staged) next to this file as /etc/nginx/snippets/corwin-cloud-topology-csp.conf.

log_format logreq_corwin_cloud '$remote_addr $time_iso8601 "$uri" $status "$http_user_agent"';

server {
    listen 80;
    listen [::]:80;
    server_name corwin.cloud www.corwin.cloud;
    access_log /var/log/nginx/corwin.cloud/access.log logreq_corwin_cloud;
    error_log /var/log/nginx/corwin.cloud/error.log;
    log_not_found off;
    # renewals answer here, over plain http, from the same webroot the certificate was first issued from
    location /.well-known/acme-challenge/ {
        root /var/www/corwin.cloud/public;
    }
    location / {
        return 301 https://corwin.cloud$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name corwin.cloud www.corwin.cloud;
    access_log /var/log/nginx/corwin.cloud/access.log logreq_corwin_cloud;
    error_log /var/log/nginx/corwin.cloud/error.log;
    log_not_found off;
    ssl_certificate     /etc/letsencrypt/live/corwin.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/corwin.cloud/privkey.pem;

    root /var/www/corwin.cloud/public;
    index index.html;
    error_page 404 /404.html;
    autoindex off;

    # The site's own pages: scripts and styles from this origin only; nothing inline; no other host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Fresh after every install: a browser may keep any file, but must ask first (no-cache); nginx
    # answers 304 when the ETag (or Last-Modified) still matches, so asking costs one small request.
    # Corwin's browser showed an old page for a day under max-age=86400 (2026-11-01).
    etag on;
    add_header Cache-Control "no-cache" always;

    # $uri.html: a page answers at its short address too (corwin.cloud/alchemy is alchemy.html), so
    # nobody typing an address has to remember a file name (2026-11-12)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Release channels. about-corwin's minter (a timer on this host, as the gw33 user) writes
    # /var/www/corwin.cloud-dist/about-corwin/: channel.json, the tarballs and their manifests. That
    # folder is outside public/, so install.sh's rsync --delete never touches it. ^~ keeps the css/js
    # regex below from catching anything in here. add_header does not inherit, so repeat the safe ones.
    location ^~ /dist/ {
        alias /var/www/corwin.cloud-dist/;
        autoindex off;
        default_type application/octet-stream;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # The live Emacs build list for the builds card (js/builds.js, from about-corwin): corwin.bru.st's
    # emacs-latest.json passed through on this site, so the pages keep connect-src 'self' and load nothing from
    # another host.  GET only; nothing from the visitor is forwarded (no headers, no cookies, no address).
    location = /feeds/emacs-latest.json {
        limit_except GET { deny all; }
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host corwin.bru.st;
        proxy_pass https://corwin.bru.st/emacs-latest.json;
        proxy_ssl_server_name on;
        proxy_ssl_name corwin.bru.st;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;   # leaf, R1x, ISRG root: the default of 1 refused the chain (502, 2026-11-11)
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
        proxy_hide_header Set-Cookie;
        proxy_hide_header Upgrade;         # Apache upstream sends "Upgrade: h2"; illegal on HTTP/2, browsers drop the stream
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        proxy_hide_header Vary;
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }

    # topology, staged from its own checkout at build time. Its pages carry inline scripts, so this
    # subtree has its own policy that lists each by hash (generated by build.py). add_header does
    # not inherit into a location that sets its own, so the other headers are repeated.
    location /topology/ {
        include snippets/corwin-cloud-topology-csp.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ =404;
    }

    # the demo apps, staged at build time (/demo/<app>/): scripts only from this site, inline styles
    # allowed, as build.py writes in generated/demo-csp.conf. ^~ keeps the regex below from overriding it.
    location ^~ /demo/ {
        include snippets/corwin-cloud-demo-csp.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri $uri/ =404;
    }

    location ~* \.(css|js|svg)$ {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
